    <!-- 微分積分学は自然科学および工学の重要な礎となる科目であり，さらに社会科学や医療分野などを含めた幅広いデータサイエンスの基礎としても重要である．
授業では，積分法について理解する．授業の前半では，１変数関数の積分法について高校で学習した内容を体系的に理解し，新しい概念や定理も学ぶ．授業の後半では，多変数関数の積分法やその応用について理解する．

 到達目標         	
授業の全体を通して，１変数関数の理論がどのように多変数関数の理論に拡張されるかについての理解を深めるとともに，科学の諸分野で現れる問題を数学的に定式化し，解決する能力を高める．1変数および多変数の積分法に習熟し，定積分，原始関数，線績分，面積，体積，曲面積などを具体的に計算できるようになる．

 授業計画         	
《１変数関数の積分法》
１．定積分の定義と性質，微分積分学の基本定理
２．広義積分の定義とその収束の条件
３．ガンマ関数，ベータ関数

《多変数関数の積分法》
４．重積分の定義とその性質（主として２,３次元）
５．重積分の計算法（累次積分，変数変換による積分など）
６．広義積分の定義と計算例
７．重積分の応用（体積，曲面積，線積分とグリーンの定理など）

《より進んだ話題》
扱われる場合は多くとも2回程度．
